# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Frontend testing --playwright

on:
  push:
  pull_request:

jobs:
  frontend-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nsai/frontend
    strategy:
      matrix:
        node-version: ['20']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: nsai/frontend/package-lock.json

    - name: installing dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: build frontend (only if build command is configured inside package.json)
      run: npm run build --if-present
      
    - name: run playwright tests
      run: npx playwright test

    - name: Document playwright reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-reports-generation
        path: nsai/frontend/playwright-report
        retention-days: 7
      
